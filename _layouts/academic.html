<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="Chenlong (Charlie) Zhang">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/avatar.png' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
    {% if site.google_site_verification %}<meta name="google-site-verification" content="{{ site.google_site_verification | escape }}">{% endif %}
    {% if site.bing_site_verification %}<meta name="msvalidate.01" content="{{ site.bing_site_verification | escape }}">{% endif %}
    {% if site.baidu_site_verification %}<meta name="baidu-site-verification" content="{{ site.baidu_site_verification | escape }}">{% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
  </head>
  <body>
    {{ content }}
  </body>
</html>
